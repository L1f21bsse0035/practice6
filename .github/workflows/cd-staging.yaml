name: wf-cd-staging

on:
  push:
    branches:
      - "release/**"

jobs:
  ci-build-staging-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
             ref: ${{github.ref}}
      - name: Build Website
        run: |
          npx parcel build "./src/index.html" --dist-dir "./docs" --public-url "./"
      - name: Disable Jekyll
        run: echo > ./docs/.nojekyll
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
          name: "staging-artifact"

  ci-deploy-staging-job:
    needs: ci-build-staging-job
    permissions:
      pages: write
      id-token: write
    environment: "staging-env"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Build Artifacts on GH Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "staging-artifact"
          token: ${{ github.token }}
